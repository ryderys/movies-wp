# Example nginx site for media.asiastarx.ir (HTTPS managed by Certbot).
# Copy into /etc/nginx/sites-available/media.asiastarx.ir and adjust ssl paths if needed.
#
# After certbot, keep the listen 443 ssl server block and merge these locations.

server {
    server_name media.asiastarx.ir;

    # Placeholder / health
    root /var/www/media.asiastarx.ir;
    index index.html;

    # NEVER publish /data as a public alias.
    location = /data {
        return 404;
    }
    location ^~ /data/ {
        return 404;
    }

    # Stream (play)
    location ~ ^/v/(?<media_token>.+)$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/media.asiastarx.ir/verify.php;
        fastcgi_param MEDIA_TOKEN $media_token;
        fastcgi_param MEDIA_TYPE v;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;  # adjust php version socket
    }

    # Download
    location ~ ^/d/(?<media_token>.+)$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/media.asiastarx.ir/verify.php;
        fastcgi_param MEDIA_TOKEN $media_token;
        fastcgi_param MEDIA_TYPE d;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Internal only — used by X-Accel-Redirect after token OK
    location /internal-media/ {
        internal;
        alias /data/;
        # Important for video seeking:
        add_header Accept-Ranges bytes;
    }

    # Admin scan API (HMAC). Not the playback token scheme.
    # Deploy http/scan-movie.php + lib/*.php; do not serve lib as static files.
    location = /scan/movie {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/media.asiastarx.ir/http/scan-movie.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location = /scan/series {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/media.asiastarx.ir/http/scan-series.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ^~ /lib/ {
        deny all;
    }
    location ^~ /http/ {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # listen 443 ssl ... (certbot)
    # listen 80 ... (certbot redirect)
}
